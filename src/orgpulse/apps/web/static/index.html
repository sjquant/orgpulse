<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>orgpulse</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
  <script>
    try {
      const theme = localStorage.getItem("orgpulse-theme");
      if (theme) document.documentElement.dataset.theme = theme;
    } catch {}
  </script>
</head>
<body>
  <div class="app" id="app">
    <nav class="card sidebar" aria-label="Scope">
      <div class="brand">
        <strong>orgpulse</strong>
        <span id="org" class="muted"></span>
      </div>
      <div id="nav"></div>
      <p id="synced" class="synced muted"></p>
    </nav>

    <main class="card main">
      <header class="head">
        <div class="head__title" id="title"></div>
        <div class="head__controls">
          <select id="count" aria-label="Range"></select>
          <div class="segmented" id="grain" role="group"></div>
          <button type="button" class="icon-button" id="theme" aria-label="Toggle theme"></button>
        </div>
      </header>
      <p id="error" class="error" hidden></p>
      <div class="kpis" id="kpis"></div>
      <section class="card inner chart" id="chart"></section>
      <section class="card inner" id="detail"></section>
    </main>

    <aside class="card panel" id="panel" hidden></aside>
  </div>
  <div class="tooltip" id="tooltip" role="status" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
